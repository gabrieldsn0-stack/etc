<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="estilo-cnct.css">
<style>
.parede{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#3B2A12,#120B04 80%)}
.janela{position:absolute;left:90px;top:70px;width:900px;height:1210px;border-radius:120px;padding:40px;background:linear-gradient(140deg,#C89350,#6A4219 22%,#2C1A08 55%,#7A4E22 85%,#C08A48);box-shadow:0 30px 70px rgba(0,0,0,.7),inset 0 0 0 3px rgba(255,220,170,.25)}
.vidro{position:relative;width:100%;height:100%;border-radius:90px;overflow:hidden;box-shadow:inset 0 0 0 5px #1A0F05,inset 0 24px 60px rgba(0,0,0,.6)}
.vidro img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) sepia(.25) brightness(.9);transform:scaleX(1.25)}
.vidro::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,206,140,.32),transparent 35%,rgba(20,12,4,.35)),radial-gradient(ellipse at 85% 30%,rgba(255,220,160,.35),transparent 40%)}
.txt{position:absolute;inset:0;z-index:2;display:grid;align-content:center;justify-items:center;gap:60px;text-align:center;padding:0 40px}
</style>
<div class="arte grao">
  <div class="parede"></div>
  <div class="janela"><div class="vidro">
    <img src="../../fundos/paisagem-feed.jpg" alt="">
    <div class="txt">
      <span class="pilula">efraim</span>
      <p class="tt" style="--s:84px;line-height:.95;text-shadow:0 2px 20px rgba(0,0,0,.25)">Preparar o seu<br>coração é<br>criar espaço<br>para viver tudo<br>aquilo que Ele<br>preparou para<br>esses dias</p>
      <p class="leve" style="font-size:30px">Aproximem-se de Deus e Ele se<br>aproximará de vocês. Tg 4:8</p>
    </div>
  </div></div>
</div>
